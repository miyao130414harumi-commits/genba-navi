<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&#x793E;&#x5185;&#x8CC7;&#x6599;&#x30CA;&#x30EC;&#x30C3;&#x30B8;&#x691C;&#x7D22;&#x30B7;&#x30B9;&#x30C6;&#x30E0;</title>
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --indigo: #4f46e5; --indigo-dark: #4338ca; --indigo-bg: #eef2ff;
      --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
      --slate-300: #cbd5e1; --slate-500: #64748b; --slate-600: #475569; --slate-900: #0f172a;
    }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--slate-50); color: var(--slate-900);
    }
    button { cursor: pointer; font-family: inherit; }
    button:active { opacity: .85; }
    button:disabled { opacity: .5; cursor: default; }

    /* ============ &#x30ED;&#x30B0;&#x30A4;&#x30F3;&#x753B;&#x9762; ============ */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .login-box { width: 100%; max-width: 400px; }
    .login-logo {
      width: 56px; height: 56px; border-radius: 14px; background: var(--indigo);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin: 0 auto 16px;
    }
    .login-title { text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .login-sub { text-align: center; font-size: 13px; color: var(--slate-500); margin: 6px 0 24px; }

    /* ============ &#x30D8;&#x30C3;&#x30C0;&#x30FC; ============ */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: #fff; border-bottom: 1px solid var(--slate-200);
      height: 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px; background: var(--indigo);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .brand-title { font-weight: 600; letter-spacing: -0.02em; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .user-name { font-size: 13px; color: var(--slate-600); }
    .role-badge {
      color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600;
      background: var(--indigo);
    }
    .role-badge.staff { background: var(--slate-500); }
    .menu-btn {
      display: none; border: none; background: transparent; font-size: 22px;
      color: var(--slate-600); width: 44px; height: 44px; border-radius: 10px;
    }
    .menu-btn:hover { background: var(--slate-100); }

    /* ============ &#x30EC;&#x30A4;&#x30A2;&#x30A6;&#x30C8; ============ */
    .layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar {
      width: 232px; background: #fff; border-right: 1px solid var(--slate-200);
      padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      border: none; background: transparent; color: var(--slate-600);
      font-size: 14px; font-weight: 500; padding: 0 12px; height: 44px;
      border-radius: 10px; text-align: left;
    }
    .nav-btn:hover { background: var(--slate-100); }
    .nav-btn.active { background: var(--indigo-bg); color: var(--indigo-dark); font-weight: 600; }
    .sidebar-footer { margin-top: auto; border-top: 1px solid var(--slate-200); padding-top: 12px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; }

    main { flex: 1; padding: 28px 24px; max-width: 1120px; margin: 0 auto; width: 100%; min-width: 0; }

    /* ============ &#x5171;&#x901A;&#x30D1;&#x30FC;&#x30C4; ============ */
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-size: 24px; letter-spacing: -0.02em; }
    .subtitle { font-size: 13px; color: var(--slate-500); margin-top: 4px; }
    .btn {
      border: none; border-radius: 10px; background: var(--indigo); color: #fff;
      font-size: 14px; font-weight: 600; padding: 0 16px; height: 42px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: var(--indigo-dark); }
    .btn.secondary { background: #fff; color: var(--slate-900); border: 1px solid var(--slate-200); }
    .btn.secondary:hover { background: var(--slate-50); }
    .btn.danger { background: #dc2626; }
    .btn.ghost { background: transparent; color: var(--slate-600); font-weight: 500; }
    .btn.ghost:hover { background: var(--slate-100); }
    .btn.small { height: 36px; padding: 0 12px; font-size: 13px; }
    .btn.wide { width: 100%; }

    .card {
      background: #fff; border: 1px solid var(--slate-200); border-radius: 12px;
      padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    input, select, textarea {
      width: 100%; padding: 12px 14px; font-size: 16px; /* 16px&#x4EE5;&#x4E0A;&#x3067;iOS&#x306E;&#x30BA;&#x30FC;&#x30E0;&#x66B4;&#x767A;&#x3092;&#x9632;&#x3050; */
      border: 1px solid var(--slate-300); border-radius: 10px;
      background: #fff; color: var(--slate-900); font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid rgba(99,102,241,.35); border-color: var(--indigo); }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--slate-600); }
    .field { margin-bottom: 16px; }

    .search-wrap { position: relative; margin-bottom: 16px; max-width: 640px; }
    .search-wrap input { padding-left: 14px; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--slate-500); font-size: 15px; }

    .filter-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .filter-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .filter-label { font-size: 13px; color: var(--slate-600); margin: 12px 0 6px; display: flex; align-items: center; gap: 4px; }

    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 7px;
      font-size: 12px; background: var(--indigo-bg); color: var(--indigo-dark);
    }
    .badge.tag { background: var(--slate-100); color: #334155; }
    .badge.link { background: #fef3c7; color: #92400e; }
    .chip {
      display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 8px; font-size: 13px;
      background: var(--slate-100); color: #334155; border: 1px solid var(--slate-200);
      margin: 0 6px 6px 0; cursor: pointer; user-select: none;
    }
    .chip.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }

    /* ============ &#x8CC7;&#x6599;&#x30B0;&#x30EA;&#x30C3;&#x30C9; ============ */
    .grid {
      display: grid; gap: 16px; margin-top: 20px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    .doc-card {
      background: #fff; border: 1px solid var(--slate-200); border-radius: 12px;
      padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04); transition: box-shadow .15s ease-out;
      text-align: left; font-family: inherit; font-size: inherit;
    }
    .doc-card:hover { box-shadow: 0 4px 10px rgba(0,0,0,.08); }
    .doc-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .doc-icon {
      width: 36px; height: 36px; border-radius: 10px; background: var(--indigo-bg);
      color: var(--indigo); display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .doc-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-desc { font-size: 13px; color: var(--slate-600); line-height: 1.7; }
    .doc-meta { font-size: 12px; color: var(--slate-500); font-variant-numeric: tabular-nums; margin-top: auto; display: flex; align-items: center; gap: 5px; }

    .empty {
      background: #fff; border: 1px solid var(--slate-200); border-radius: 12px;
      text-align: center; color: var(--slate-500); padding: 48px 16px; font-size: 14px; margin-top: 20px;
    }
    .preview-frame {
      width: 100%; height: 62vh; min-height: 340px;
      border: 1px solid var(--slate-200); border-radius: 10px; background: var(--slate-100);
    }
    .hidden { display: none !important; }
    .list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--slate-100); gap: 8px;
    }
    .muted { font-size: 12px; color: #94a3b8; }
    .row { display: flex; gap: 10px; align-items: center; }
    #status, #loginStatus { text-align: center; font-size: 14px; min-height: 20px; margin-bottom: 8px; }
    .ok { color: #059669; } .ng { color: #dc2626; }
    .file-drop {
      border: 2px dashed var(--slate-300); border-radius: 12px; padding: 28px 16px;
      text-align: center; color: var(--slate-500); font-size: 14px;
      cursor: pointer; margin-bottom: 16px;
    }
    .file-drop:hover { border-color: var(--indigo); background: var(--slate-50); }
    .file-drop.has-file { border-color: var(--indigo); color: var(--indigo-dark); background: var(--indigo-bg); }
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .mode-tab {
      flex: 1; border: 1px solid var(--slate-200); background: #fff; color: var(--slate-600);
      border-radius: 10px; height: 40px; font-size: 13px; font-weight: 600;
    }
    .mode-tab.active { background: var(--indigo-bg); color: var(--indigo-dark); border-color: var(--indigo); }
    .detail-title { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }

    /* ============ &#x30EC;&#x30B9;&#x30DD;&#x30F3;&#x30B7;&#x30D6; ============ */
    @media (max-width: 900px) {
      .menu-btn { display: flex; align-items: center; justify-content: center; }
      .sidebar {
        position: fixed; top: 0; bottom: 0; left: 0; z-index: 40;
        transform: translateX(-100%); transition: transform .15s ease-out;
        padding-top: 20px;
      }
      .sidebar.open { transform: translateX(0); }
      .overlay.show { display: block; }
      main { padding: 20px 16px; }
      .brand-title { font-size: 14px; }
      .user-name { display: none; }
    }
  </style>
</head>
<body>

  <!-- ============ &#x30ED;&#x30B0;&#x30A4;&#x30F3;&#x753B;&#x9762;(&#x30C7;&#x30D5;&#x30A9;&#x30EB;&#x30C8;&#x8868;&#x793A;&#x3002;JS&#x30A8;&#x30E9;&#x30FC;&#x6642;&#x3082;&#x767D;&#x753B;&#x9762;&#x306B;&#x306A;&#x3089;&#x306A;&#x3044;) ============ -->
  <div id="loginView" class="login-wrap">
    <div class="login-box">
      <div class="login-logo"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="width:62%;height:62%;display:block;"><g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><path d="M104 158 C152 132 200 132 248 158 L248 372 C200 346 152 346 104 372 Z" fill="rgba(255,255,255,0.15)"/><path d="M392 158 C344 132 296 132 248 158 L248 372 C296 346 344 346 392 372 Z" fill="rgba(255,255,255,0.15)"/></g><g stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.9"><line x1="140" y1="208" x2="208" y2="196"/><line x1="140" y1="254" x2="208" y2="242"/></g><g stroke="#ffffff" stroke-linecap="round" fill="none"><circle cx="318" cy="258" r="80" stroke-width="34" fill="rgba(67,56,202,0.45)"/><line x1="376" y1="316" x2="436" y2="376" stroke-width="42"/></g></svg></div>
      <div class="login-title">&#x793E;&#x5185;&#x8CC7;&#x6599;&#x30CA;&#x30EC;&#x30C3;&#x30B8;&#x691C;&#x7D22;&#x30B7;&#x30B9;&#x30C6;&#x30E0;</div>
      <div class="login-sub">&#x793E;&#x54E1;&#x30ED;&#x30B0;&#x30A4;&#x30F3; <span style="color:#cbd5e1;">v5-Pages&#x7248;</span></div>
      <div class="card">
        <div id="loginStatus"></div>
        <div class="field">
          <label>&#x30ED;&#x30B0;&#x30A4;&#x30F3;ID</label>
          <input id="loginId" placeholder="ID&#x3092;&#x5165;&#x529B;" autocomplete="username">
        </div>
        <div class="field">
          <label>&#x30D1;&#x30B9;&#x30EF;&#x30FC;&#x30C9;</label>
          <input id="loginPw" type="password" placeholder="&#x30D1;&#x30B9;&#x30EF;&#x30FC;&#x30C9;&#x3092;&#x5165;&#x529B;" autocomplete="current-password">
        </div>
        <button class="btn wide" id="loginBtn" onclick="doLogin()">&#x30ED;&#x30B0;&#x30A4;&#x30F3;</button>
      </div>
    </div>
  </div>

  <!-- ============ &#x30A2;&#x30D7;&#x30EA;&#x672C;&#x4F53; ============ -->
  <div id="appShell" class="hidden">
    <div class="topbar">
      <div class="brand">
        <button class="menu-btn" onclick="toggleSidebar(true)">&#x2630;</button>
        <div class="brand-icon"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="width:62%;height:62%;display:block;"><g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><path d="M104 158 C152 132 200 132 248 158 L248 372 C200 346 152 346 104 372 Z" fill="rgba(255,255,255,0.15)"/><path d="M392 158 C344 132 296 132 248 158 L248 372 C296 346 344 346 392 372 Z" fill="rgba(255,255,255,0.15)"/></g><g stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.9"><line x1="140" y1="208" x2="208" y2="196"/><line x1="140" y1="254" x2="208" y2="242"/></g><g stroke="#ffffff" stroke-linecap="round" fill="none"><circle cx="318" cy="258" r="80" stroke-width="34" fill="rgba(67,56,202,0.45)"/><line x1="376" y1="316" x2="436" y2="376" stroke-width="42"/></g></svg></div>
        <div class="brand-title">&#x793E;&#x5185;&#x8CC7;&#x6599;&#x30CA;&#x30EC;&#x30C3;&#x30B8;&#x691C;&#x7D22;&#x30B7;&#x30B9;&#x30C6;&#x30E0;</div>
      </div>
      <div class="topbar-right">
        <span class="user-name" id="userName"></span>
        <span class="role-badge" id="roleBadge"></span>
        <button class="btn ghost small" onclick="doLogout()">&#x30ED;&#x30B0;&#x30A2;&#x30A6;&#x30C8;</button>
      </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

    <div class="layout">
      <nav class="sidebar" id="sidebar">
        <button class="nav-btn active" id="nav-listView" onclick="navTo('listView')">&#x8CC7;&#x6599;&#x691C;&#x7D22;</button>
        <button class="nav-btn hidden adminOnly" id="nav-editView" onclick="navToNew()">&#x8CC7;&#x6599;&#x767B;&#x9332;</button>
        <button class="nav-btn hidden adminOnly" id="nav-masterView" onclick="navTo('masterView')">&#x30AB;&#x30C6;&#x30B4;&#x30EA;&#x30FB;&#x30BF;&#x30B0;&#x7BA1;&#x7406;</button>
        <div class="sidebar-footer">
          <button class="nav-btn" onclick="doLogout()">&#x30ED;&#x30B0;&#x30A2;&#x30A6;&#x30C8;</button>
        </div>
      </nav>

      <main>
        <div id="status"></div>

        <!-- ============ &#x691C;&#x7D22;&#x30FB;&#x4E00;&#x89A7; ============ -->
        <div id="listView">
          <div class="page-head">
            <div>
              <h1>&#x8CC7;&#x6599;&#x691C;&#x7D22;</h1>
              <div class="subtitle">&#x30AD;&#x30FC;&#x30EF;&#x30FC;&#x30C9;&#x30FB;&#x30AB;&#x30C6;&#x30B4;&#x30EA;&#x30FB;&#x30BF;&#x30B0;&#x3067;&#x793E;&#x5185;&#x8CC7;&#x6599;&#x3092;&#x63A2;&#x305B;&#x307E;&#x3059;</div>
            </div>
            <button class="btn hidden adminOnly" onclick="navToNew()">&#xFF0B; &#x65B0;&#x898F;&#x767B;&#x9332;</button>
          </div>

          <div class="search-wrap">
            <input id="keyword" placeholder="&#x30BF;&#x30A4;&#x30C8;&#x30EB;&#x30FB;&#x8AAC;&#x660E;&#x30FB;&#x30D5;&#x30A1;&#x30A4;&#x30EB;&#x540D;&#x3067;&#x691C;&#x7D22;" oninput="onKeywordInput()">
          </div>

          <div class="card">
            <div class="filter-head">
              <div class="filter-title">&#x7D5E;&#x308A;&#x8FBC;&#x307F;</div>
              <button class="btn ghost small hidden" id="clearBtn" onclick="clearFilters()">&#x2715; &#x6761;&#x4EF6;&#x3092;&#x30AF;&#x30EA;&#x30A2;</button>
            </div>
            <div class="filter-label">&#x30AB;&#x30C6;&#x30B4;&#x30EA;</div>
            <select id="catFilter" onchange="render()"></select>
            <div class="filter-label">&#x30BF;&#x30B0;</div>
            <div id="tagChips"></div>
          </div>

          <div id="docList" class="grid"></div>
          <div id="emptyBox" class="empty hidden">&#x8A72;&#x5F53;&#x3059;&#x308B;&#x8CC7;&#x6599;&#x304C;&#x898B;&#x3064;&#x304B;&#x3089;&#x306A;&#x304B;&#x3063;&#x305F;&#x3088;</div>
        </div>

        <!-- ============ &#x8A73;&#x7D30; ============ -->
        <div id="detailView" class="hidden">
          <div class="page-head">
            <button class="btn secondary small" onclick="navTo('listView')">&#x2190; &#x8CC7;&#x6599;&#x691C;&#x7D22;&#x3078;&#x623B;&#x308B;</button>
            <div class="row hidden adminOnly">
              <button class="btn secondary small" onclick="editCurrent()">&#x7DE8;&#x96C6;</button>
              <button class="btn danger small" onclick="deleteCurrent()">&#x524A;&#x9664;</button>
            </div>
          </div>
          <div class="card">
            <div id="detailBody"></div>
            <div style="margin-top:16px;">
              <button class="btn" id="downloadBtn" onclick="openFile()">&#x30C0;&#x30A6;&#x30F3;&#x30ED;&#x30FC;&#x30C9; / &#x958B;&#x304F;</button>
            </div>
          </div>
        </div>

        <!-- ============ &#x767B;&#x9332;&#x30FB;&#x7DE8;&#x96C6;(&#x7BA1;&#x7406;&#x8005;&#x306E;&#x307F;) ============ -->
        <div id="editView" class="hidden">
          <div class="page-head">
            <button class="btn secondary small" onclick="navTo('listView')">&#x2190; &#x8CC7;&#x6599;&#x691C;&#x7D22;&#x3078;&#x623B;&#x308B;</button>
          </div>
          <div class="card" style="max-width:680px;">
            <h1 id="editTitle" style="font-size:20px; margin-bottom:16px;">&#x8CC7;&#x6599;&#x306E;&#x65B0;&#x898F;&#x767B;&#x9332;</h1>

            <div class="mode-tabs">
              <button class="mode-tab active" id="modeFile" onclick="setMode('file')">&#x30D5;&#x30A1;&#x30A4;&#x30EB;&#x3092;&#x767B;&#x9332;</button>
              <button class="mode-tab" id="modeUrl" onclick="setMode('url')">&#x5916;&#x90E8;URL&#x3092;&#x767B;&#x9332;</button>
            </div>

            <div id="fileMode">
              <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
                &#x30BF;&#x30C3;&#x30D7;&#x3057;&#x3066;PDF&#x30FB;&#x753B;&#x50CF;&#x3092;&#x9078;&#x629E;
              </div>
              <input type="file" id="fileInput" accept="application/pdf,image/*" class="hidden" onchange="onFilePicked(this.files[0])">
            </div>

            <div id="urlMode" class="hidden">
              <div class="field">
                <label>&#x8CC7;&#x6599;&#x306E;URL(PDF&#x76F4;&#x30EA;&#x30F3;&#x30AF;&#x3084;&#x516C;&#x958B;&#x30DA;&#x30FC;&#x30B8;)</label>
                <input id="fUrl" placeholder="https://example.go.jp/xxx.pdf" inputmode="url">
              </div>
            </div>

            <div class="field">
              <label>&#x30BF;&#x30A4;&#x30C8;&#x30EB;</label>
              <input id="fTitle" placeholder="&#x4F8B;: &#x65B0;&#x4EBA;&#x7814;&#x4FEE;&#x30DE;&#x30CB;&#x30E5;&#x30A2;&#x30EB;2026">
            </div>
            <div class="field">
              <label>&#x8AAC;&#x660E;&#x6587;</label>
              <textarea id="fDesc" rows="3" placeholder="&#x8CC7;&#x6599;&#x306E;&#x6982;&#x8981;"></textarea>
            </div>
            <div class="field">
              <label>&#x30AB;&#x30C6;&#x30B4;&#x30EA;</label>
              <select id="fCat"></select>
            </div>
            <div class="field">
              <label>&#x30BF;&#x30B0;(&#x30BF;&#x30C3;&#x30D7;&#x3067;&#x9078;&#x629E;)</label>
              <div id="fTags"></div>
            </div>
            <button class="btn wide" id="saveBtn" onclick="saveDoc()">&#x4FDD;&#x5B58;&#x3059;&#x308B;</button>
          </div>
        </div>

        <!-- ============ &#x30DE;&#x30B9;&#x30BF;&#x7BA1;&#x7406;(&#x7BA1;&#x7406;&#x8005;&#x306E;&#x307F;) ============ -->
        <div id="masterView" class="hidden">
          <div class="page-head">
            <div>
              <h1>&#x30AB;&#x30C6;&#x30B4;&#x30EA;&#x30FB;&#x30BF;&#x30B0;&#x7BA1;&#x7406;</h1>
              <div class="subtitle">&#x8CC7;&#x6599;&#x306E;&#x30AB;&#x30C6;&#x30B4;&#x30EA;&#x3068;&#x30BF;&#x30B0;&#x3092;&#x8FFD;&#x52A0;&#x30FB;&#x524A;&#x9664;&#x3067;&#x304D;&#x307E;&#x3059;</div>
            </div>
          </div>
          <div class="card" style="margin-bottom:16px;">
            <div class="filter-title" style="margin-bottom:12px;">&#x30AB;&#x30C6;&#x30B4;&#x30EA;</div>
            <div class="row">
              <input id="newCat" placeholder="&#x4F8B;: &#x55B6;&#x696D;&#x30DE;&#x30CB;&#x30E5;&#x30A2;&#x30EB;">
              <button class="btn small" onclick="addMaster('cats')">&#x8FFD;&#x52A0;</button>
            </div>
            <div id="catList" style="margin-top:10px;"></div>
          </div>
          <div class="card">
            <div class="filter-title" style="margin-bottom:12px;">&#x30BF;&#x30B0;</div>
            <div class="row">
              <input id="newTag" placeholder="&#x4F8B;: &#x65B0;&#x4EBA;&#x5411;&#x3051;">
              <button class="btn small" onclick="addMaster('tags')">&#x8FFD;&#x52A0;</button>
            </div>
            <div id="tagList" style="margin-top:10px;"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    // ============================================
    // GAS\u76F4\u30C7\u30D7\u30ED\u30A4\u306A\u3089\u7A7A\u306E\u307E\u307E\u3002
    // GitHub Pages\u5074\u304B\u3089\u4F7F\u3046\u306A\u3089Web\u30A2\u30D7\u30EAURL\u3092\u5165\u308C\u308B
    // ============================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzPd0Ijfy7mm8N78_yHC5cpp-3KK_Sf0RX3O3aWOvqalYkDgwf5LilGWIUMsYt_i_INJw/exec';

    // JS\u30A8\u30E9\u30FC\u304C\u8D77\u304D\u305F\u3089\u767D\u753B\u9762\u306B\u305B\u305A\u5185\u5BB9\u3092\u8868\u793A\u3059\u308B
    window.onerror = function (msg, src, line) {
      const el = document.getElementById('loginStatus');
      if (el) { el.textContent = '\u30A8\u30E9\u30FC: ' + msg + ' (\u884C' + line + ')'; el.className = 'ng'; }
    };

    function storageSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    function storageRemove(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

    let all = { docs: [], cats: [], tags: [] };
    let keyword = '';
    let selTagIds = new Set();
    let currentDoc = null;
    let editingId = null;
    let uploadedFile = null; // { fileId, fileName, fileType }
    let editMode = 'file';   // 'file' | 'url'
    let session = null;      // { token, name, role }
    let kwTimer = null;

    try { session = JSON.parse(sessionStorage.getItem('session') || 'null'); } catch (e) { session = null; }

    // ============================================
    // API\u547C\u3073\u51FA\u3057(GAS\u76F4 / fetch \u4E21\u5BFE\u5FDC)
    // ============================================
    function callApi(req) {
      if (session && session.token) req.token = session.token;
      let p;
      if (GAS_URL) {
        p = fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(req),
        }).then(r => r.json()).then(res => {
          if (!res.ok) throw new Error(res.error);
          return res.result;
        });
      } else {
        if (typeof google === 'undefined') {
          return Promise.reject(new Error('GAS_URL\u304C\u672A\u8A2D\u5B9A\u3060\u3088\u3002GitHub Pages\u304B\u3089\u4F7F\u3046\u3068\u304D\u306F\u30D5\u30A1\u30A4\u30EB\u5192\u982D\u306EGAS_URL\u306BWeb\u30A2\u30D7\u30EAURL\u3092\u5165\u308C\u3066\u306D'));
        }
        p = new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(res => res.ok ? resolve(res.result) : reject(new Error(res.error)))
            .withFailureHandler(err => reject(err))
            .api(req);
        });
      }
      return p.catch(err => {
        // \u30BB\u30C3\u30B7\u30E7\u30F3\u5207\u308C\u306A\u3089\u5F37\u5236\u30ED\u30B0\u30A2\u30A6\u30C8
        if (/\u30BB\u30C3\u30B7\u30E7\u30F3|\u30ED\u30B0\u30A4\u30F3\u304C\u5FC5\u8981/.test(err.message)) {
          clearSession();
          showLogin('\u30BB\u30C3\u30B7\u30E7\u30F3\u304C\u5207\u308C\u305F\u3088\u3002\u30ED\u30B0\u30A4\u30F3\u3057\u306A\u304A\u3057\u3066\u306D');
        }
        throw err;
      });
    }

    function setStatus(msg, ok) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = ok ? 'ok' : 'ng';
      if (msg && ok) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2500);
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate());
    }

    function docIcon(d) {
      if (d.fileType === 'pdf') return 'PDF';
      if (d.fileType === 'image') return '\u753B\u50CF';
      return 'URL';
    }

    // ============================================
    // \u30ED\u30B0\u30A4\u30F3\u30FB\u30ED\u30B0\u30A2\u30A6\u30C8
    // ============================================
    function showLogin(msg) {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appShell').classList.add('hidden');
      const el = document.getElementById('loginStatus');
      el.textContent = msg || '';
      el.className = 'ng';
    }

    function showApp() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appShell').classList.remove('hidden');
      document.getElementById('userName').textContent = session.name;
      const badge = document.getElementById('roleBadge');
      const isAdmin = session.role === 'admin';
      badge.textContent = isAdmin ? '\u7BA1\u7406\u8005' : '\u793E\u54E1';
      badge.classList.toggle('staff', !isAdmin);
      document.querySelectorAll('.adminOnly').forEach(el => el.classList.toggle('hidden', !isAdmin));
      navTo('listView');
      load();
    }

    function clearSession() {
      session = null;
      storageRemove('session');
    }

    function doLogin() {
      const id = document.getElementById('loginId').value.trim();
      const pw = document.getElementById('loginPw').value;
      const st = document.getElementById('loginStatus');
      if (!id || !pw) { st.textContent = 'ID\u3068\u30D1\u30B9\u30EF\u30FC\u30C9\u3092\u5165\u529B\u3057\u3066\u306D'; st.className = 'ng'; return; }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      st.textContent = '\u30ED\u30B0\u30A4\u30F3\u4E2D...';
      st.className = 'ok';

      callApi({ action: 'login', data: { id: id, password: pw } }).then(res => {
        btn.disabled = false;
        session = { token: res.token, name: res.name, role: res.role };
        storageSet('session', JSON.stringify(session));
        document.getElementById('loginPw').value = '';
        st.textContent = '';
        showApp();
      }).catch(err => {
        btn.disabled = false;
        st.textContent = err.message;
        st.className = 'ng';
      });
    }

    function doLogout() {
      if (session && session.token) {
        callApi({ action: 'logout' }).catch(() => {});
      }
      clearSession();
      showLogin('');
      toggleSidebar(false);
    }

    // ============================================
    // \u753B\u9762\u5207\u66FF\u30FB\u30B5\u30A4\u30C9\u30D0\u30FC
    // ============================================
    function toggleSidebar(open) {
      document.getElementById('sidebar').classList.toggle('open', open);
      document.getElementById('overlay').classList.toggle('show', open);
    }

    function navTo(id) {
      // \u7BA1\u7406\u8005\u5C02\u7528\u753B\u9762\u306E\u30AC\u30FC\u30C9(UI\u975E\u8868\u793A\u306B\u52A0\u3048\u3066\u30EB\u30FC\u30C8\u5074\u3067\u3082\u5F3E\u304F)
      if ((id === 'editView' || id === 'masterView') && (!session || session.role !== 'admin')) {
        id = 'listView';
        setStatus('\u3053\u306E\u753B\u9762\u306F\u7BA1\u7406\u8005\u3060\u3051\u3060\u3088', false);
      }
      ['listView', 'detailView', 'editView', 'masterView'].forEach(v => {
        document.getElementById(v).classList.toggle('hidden', v !== id);
      });
      ['listView', 'editView', 'masterView'].forEach(v => {
        const btn = document.getElementById('nav-' + v);
        if (btn) btn.classList.toggle('active', v === id || (id === 'detailView' && v === 'listView'));
      });
      toggleSidebar(false);
      window.scrollTo(0, 0);
      if (id === 'masterView') renderMaster();
    }

    function navToNew() { openEdit(null); }

    // ============================================
    // \u30C7\u30FC\u30BF\u8AAD\u307F\u8FBC\u307F\u30FB\u4E00\u89A7\u63CF\u753B
    // ============================================
    function load() {
      setStatus('\u8AAD\u307F\u8FBC\u307F\u4E2D...', true);
      callApi({ action: 'listAll' }).then(res => {
        all = res;
        setStatus('', true);
        renderFilters();
        render();
      }).catch(err => setStatus('\u8AAD\u307F\u8FBC\u307F\u5931\u6557: ' + err.message, false));
    }

    function renderFilters() {
      const catSel = document.getElementById('catFilter');
      const cur = catSel.value;
      catSel.innerHTML = '<option value="">\u3059\u3079\u3066\u306E\u30AB\u30C6\u30B4\u30EA</option>' +
        all.cats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
      catSel.value = cur;

      document.getElementById('tagChips').innerHTML = all.tags.map(t =>
        `<span class="chip ${selTagIds.has(t.id) ? 'active' : ''}" onclick="toggleTag('${esc(t.id)}')">${esc(t.name)}</span>`
      ).join('') || '<span class="muted">\u30BF\u30B0\u306F\u307E\u3060\u306A\u3044\u3088</span>';
    }

    function toggleTag(id) {
      selTagIds.has(id) ? selTagIds.delete(id) : selTagIds.add(id);
      renderFilters();
      render();
    }

    function onKeywordInput() {
      clearTimeout(kwTimer);
      kwTimer = setTimeout(() => {
        keyword = document.getElementById('keyword').value.trim().toLowerCase();
        render();
      }, 300);
    }

    function clearFilters() {
      keyword = '';
      selTagIds.clear();
      document.getElementById('keyword').value = '';
      document.getElementById('catFilter').value = '';
      renderFilters();
      render();
    }

    function catName(id) { const c = all.cats.find(c => c.id === id); return c ? c.name : ''; }
    function tagName(id) { const t = all.tags.find(t => t.id === id); return t ? t.name : ''; }

    function filteredDocs() {
      const catId = document.getElementById('catFilter').value;
      return all.docs.filter(d => {
        if (keyword) {
          const hay = [d.title, d.description, d.fileName, d.url].join(' ').toLowerCase();
          if (!hay.includes(keyword)) return false;
        }
        if (catId && d.categoryId !== catId) return false;
        if (selTagIds.size > 0) {
          for (const tid of selTagIds) if (!d.tagIds.includes(tid)) return false;
        }
        return true;
      }).sort((a, b) => new Date(b.registeredAt) - new Date(a.registeredAt));
    }

    function render() {
      const docs = filteredDocs();
      const hasFilter = keyword || selTagIds.size > 0 || document.getElementById('catFilter').value;
      document.getElementById('clearBtn').classList.toggle('hidden', !hasFilter);
      document.getElementById('emptyBox').classList.toggle('hidden', docs.length !== 0);

      document.getElementById('docList').innerHTML = docs.map(d => `
        <button class="doc-card" onclick="openDetail('${esc(d.id)}')">
          <div class="doc-head">
            <div class="doc-icon">${docIcon(d)}</div>
            <div class="doc-title">${esc(d.title) || '\u7121\u984C\u306E\u8CC7\u6599'}</div>
          </div>
          <div>
            ${d.categoryId && catName(d.categoryId) ? `<span class="badge">${esc(catName(d.categoryId))}</span>` : ''}
            ${d.tagIds.map(tid => tagName(tid) ? ` <span class="badge tag">${esc(tagName(tid))}</span>` : '').join('')}
            ${!d.fileId && d.url ? ' <span class="badge link">\u5916\u90E8\u30EA\u30F3\u30AF</span>' : ''}
          </div>
          ${d.description ? `<div class="doc-desc">${esc(d.description.length > 80 ? d.description.slice(0, 80) + '\u2026' : d.description)}</div>` : ''}
          <div class="doc-meta">${fmtDate(d.registeredAt)}</div>
        </button>`).join('');
    }

    // ============================================
    // \u8A73\u7D30
    // ============================================
    function previewHtml(d) {
      if (d.fileId) {
        return `<iframe class="preview-frame" src="https://drive.google.com/file/d/${esc(d.fileId)}/preview" allow="autoplay"></iframe>`;
      }
      if (d.url) {
        const isPdf = /\.pdf($|\?)/i.test(d.url);
        const src = isPdf
          ? 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(d.url)
          : d.url;
        return `<iframe class="preview-frame" src="${esc(src)}"></iframe>
          <div class="muted" style="margin-top:6px;">\u203B\u30B5\u30A4\u30C8\u5074\u306E\u8A2D\u5B9A\u306B\u3088\u3063\u3066\u306F\u57CB\u3081\u8FBC\u307F\u8868\u793A\u3067\u304D\u306A\u3044\u3053\u3068\u304C\u3042\u308B\u3088\u3002\u305D\u306E\u5834\u5408\u306F\u4E0B\u306E\u30DC\u30BF\u30F3\u304B\u3089\u958B\u3044\u3066\u306D\u3002</div>`;
      }
      return '<div class="empty" style="margin-top:12px;">\u30D7\u30EC\u30D3\u30E5\u30FC\u3067\u304D\u308B\u30D5\u30A1\u30A4\u30EB\u304C\u306A\u3044\u3088</div>';
    }

    function openDetail(id) {
      currentDoc = all.docs.find(d => d.id === id);
      if (!currentDoc) return;
      const d = currentDoc;
      document.getElementById('detailBody').innerHTML = `
        <div class="doc-head" style="margin-bottom:10px;">
          <div class="doc-icon">${docIcon(d)}</div>
          <div class="detail-title">${esc(d.title)}</div>
        </div>
        <div style="margin-bottom:8px;">
          ${d.categoryId && catName(d.categoryId) ? `<span class="badge">${esc(catName(d.categoryId))}</span>` : ''}
          ${d.tagIds.map(tid => tagName(tid) ? ` <span class="badge tag">${esc(tagName(tid))}</span>` : '').join('')}
          ${!d.fileId && d.url ? ' <span class="badge link">\u5916\u90E8\u30EA\u30F3\u30AF</span>' : ''}
        </div>
        <div class="doc-meta" style="margin-bottom:12px;">
          \u767B\u9332\u65E5: ${fmtDate(d.registeredAt)}
          ${d.fileName ? ' &nbsp;\u6DFB\u4ED8: ' + esc(d.fileName) : ''}
          ${!d.fileId && d.url ? ' &nbsp;URL: ' + esc(d.url) : ''}
        </div>
        ${d.description ? `<div class="doc-desc" style="white-space:pre-wrap; margin-bottom:14px;">${esc(d.description)}</div>` : ''}
        ${previewHtml(d)}
      `;
      document.getElementById('downloadBtn').classList.toggle('hidden', !d.fileId && !d.url);
      navTo('detailView');
    }

    function openFile() {
      if (!currentDoc) return;
      if (currentDoc.fileId) {
        window.open('https://drive.google.com/uc?export=download&id=' + currentDoc.fileId, '_blank');
      } else if (currentDoc.url) {
        window.open(currentDoc.url, '_blank');
      }
    }

    function editCurrent() { if (currentDoc) openEdit(currentDoc.id); }

    function deleteCurrent() {
      if (!currentDoc) return;
      if (!confirm('\u300C' + currentDoc.title + '\u300D\u3092\u524A\u9664\u3059\u308B\uFF1F(\u30A2\u30C3\u30D7\u30ED\u30FC\u30C9\u6E08\u307F\u30D5\u30A1\u30A4\u30EB\u306F\u30C9\u30E9\u30A4\u30D6\u306E\u30B4\u30DF\u7BB1\u306B\u79FB\u52D5)')) return;
      setStatus('\u524A\u9664\u4E2D...', true);
      callApi({ action: 'deleteDoc', data: { id: currentDoc.id } }).then(() => {
        setStatus('\u524A\u9664\u3057\u305F\u3088', true);
        navTo('listView');
        load();
      }).catch(err => setStatus('\u30A8\u30E9\u30FC: ' + err.message, false));
    }

    // ============================================
    // \u767B\u9332\u30FB\u7DE8\u96C6
    // ============================================
    function setMode(mode) {
      editMode = mode;
      document.getElementById('modeFile').classList.toggle('active', mode === 'file');
      document.getElementById('modeUrl').classList.toggle('active', mode === 'url');
      document.getElementById('fileMode').classList.toggle('hidden', mode !== 'file');
      document.getElementById('urlMode').classList.toggle('hidden', mode !== 'url');
    }

    function openEdit(id) {
      editingId = id;
      uploadedFile = null;
      const doc = id ? all.docs.find(d => d.id === id) : null;
      document.getElementById('editTitle').textContent = doc ? '\u8CC7\u6599\u306E\u7DE8\u96C6' : '\u8CC7\u6599\u306E\u65B0\u898F\u767B\u9332';
      document.getElementById('fTitle').value = doc ? doc.title : '';
      document.getElementById('fDesc').value = doc ? doc.description : '';
      document.getElementById('fUrl').value = doc ? doc.url : '';

      document.getElementById('fCat').innerHTML = '<option value="">\u30AB\u30C6\u30B4\u30EA\u3092\u9078\u629E</option>' +
        all.cats.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
      document.getElementById('fCat').value = doc ? doc.categoryId : '';

      const selected = new Set(doc ? doc.tagIds : []);
      document.getElementById('fTags').innerHTML = all.tags.map(t =>
        `<span class="chip ${selected.has(t.id) ? 'active' : ''}" data-tid="${esc(t.id)}" onclick="this.classList.toggle('active')">${esc(t.name)}</span>`
      ).join('') || '<span class="muted">\u30BF\u30B0\u306F\u30DE\u30B9\u30BF\u7BA1\u7406\u304B\u3089\u8FFD\u52A0\u3057\u3066\u306D</span>';

      if (doc && doc.fileId) {
        uploadedFile = { fileId: doc.fileId, fileName: doc.fileName, fileType: doc.fileType };
        setDropLabel(doc.fileName + ' (\u30BF\u30C3\u30D7\u3067\u5DEE\u3057\u66FF\u3048)', true);
        setMode('file');
      } else if (doc && doc.url) {
        setDropLabel('\u30BF\u30C3\u30D7\u3057\u3066PDF\u30FB\u753B\u50CF\u3092\u9078\u629E', false);
        setMode('url');
      } else {
        setDropLabel('\u30BF\u30C3\u30D7\u3057\u3066PDF\u30FB\u753B\u50CF\u3092\u9078\u629E', false);
        setMode('file');
      }
      navTo('editView');
    }

    function setDropLabel(text, hasFile) {
      const el = document.getElementById('fileDrop');
      el.textContent = text;
      el.classList.toggle('has-file', hasFile);
    }

    function detectFileType(file) {
      const mime = (file.type || '').toLowerCase();
      const name = (file.name || '').toLowerCase();
      if (mime.includes('pdf') || name.endsWith('.pdf')) return 'pdf';
      if (mime.startsWith('image/') || /\.(png|jpe?g|gif|webp)$/.test(name)) return 'image';
      return null; // \u5BFE\u5FDC\u5916\u306F\u5F3E\u304F
    }

    function onFilePicked(file) {
      if (!file) return;
      const type = detectFileType(file);
      if (!type) { setStatus('PDF\u304B\u753B\u50CF\u3060\u3051\u767B\u9332\u3067\u304D\u308B\u3088', false); return; }
      if (file.size > 15 * 1024 * 1024) { setStatus('15MB\u307E\u3067\u306B\u3057\u3066\u306D', false); return; }

      setDropLabel('\u30A2\u30C3\u30D7\u30ED\u30FC\u30C9\u4E2D...', false);
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        callApi({ action: 'upload', data: { base64: base64, mimeType: file.type || 'application/octet-stream', fileName: file.name } })
          .then(res => {
            uploadedFile = { fileId: res.fileId, fileName: res.fileName, fileType: type };
            setDropLabel(res.fileName + ' (\u30BF\u30C3\u30D7\u3067\u5DEE\u3057\u66FF\u3048)', true);
            setStatus('\u30A2\u30C3\u30D7\u30ED\u30FC\u30C9\u3057\u305F\u3088', true);
          })
          .catch(err => {
            setDropLabel('\u30BF\u30C3\u30D7\u3057\u3066PDF\u30FB\u753B\u50CF\u3092\u9078\u629E', false);
            setStatus('\u30A2\u30C3\u30D7\u30ED\u30FC\u30C9\u5931\u6557: ' + err.message, false);
          });
      };
      reader.onerror = () => setStatus('\u30D5\u30A1\u30A4\u30EB\u306E\u8AAD\u307F\u8FBC\u307F\u306B\u5931\u6557\u3057\u305F\u3088', false);
      reader.readAsDataURL(file);
    }

    function saveDoc() {
      const title = document.getElementById('fTitle').value.trim();
      if (!title) { setStatus('\u30BF\u30A4\u30C8\u30EB\u3092\u5165\u308C\u3066\u306D', false); return; }

      let data;
      if (editMode === 'url') {
        const url = document.getElementById('fUrl').value.trim();
        if (!url) { setStatus('URL\u3092\u5165\u308C\u3066\u306D', false); return; }
        if (!/^https?:\/\//i.test(url)) { setStatus('URL\u306F https:// \u304B\u3089\u5165\u308C\u3066\u306D', false); return; }
        data = {
          fileType: /\.pdf($|\?)/i.test(url) ? 'pdf' : 'link',
          fileId: '', fileName: '', url: url,
        };
      } else {
        if (!uploadedFile) { setStatus('\u30D5\u30A1\u30A4\u30EB\u3092\u30A2\u30C3\u30D7\u30ED\u30FC\u30C9\u3057\u3066\u306D', false); return; }
        data = {
          fileType: uploadedFile.fileType,
          fileId: uploadedFile.fileId,
          fileName: uploadedFile.fileName,
          url: '',
        };
      }

      const tagIds = [...document.querySelectorAll('#fTags .chip.active')].map(el => el.dataset.tid);
      Object.assign(data, {
        id: editingId,
        title: title,
        description: document.getElementById('fDesc').value.trim(),
        categoryId: document.getElementById('fCat').value,
        tagIds: tagIds,
      });

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      setStatus('\u4FDD\u5B58\u4E2D...', true);
      callApi({ action: editingId ? 'updateDoc' : 'addDoc', data: data }).then(() => {
        btn.disabled = false;
        setStatus(editingId ? '\u66F4\u65B0\u3057\u305F\u3088' : '\u767B\u9332\u3057\u305F\u3088', true);
        navTo('listView');
        load();
      }).catch(err => {
        btn.disabled = false;
        setStatus('\u4FDD\u5B58\u5931\u6557: ' + err.message, false);
      });
    }

    // ============================================
    // \u30DE\u30B9\u30BF\u7BA1\u7406
    // ============================================
    function renderMaster() {
      const catUsage = id => all.docs.filter(d => d.categoryId === id).length;
      const tagUsage = id => all.docs.filter(d => d.tagIds.includes(id)).length;

      document.getElementById('catList').innerHTML = all.cats.map(c => `
        <div class="list-item">
          <span><span class="badge">${esc(c.name)}</span> <span class="muted">${catUsage(c.id)}\u4EF6\u3067\u4F7F\u7528\u4E2D</span></span>
          <button class="btn danger small" onclick="delMaster('cats','${esc(c.id)}','${esc(c.name)}',${catUsage(c.id)})">\u524A\u9664</button>
        </div>`).join('') || '<div class="muted">\u30AB\u30C6\u30B4\u30EA\u306F\u307E\u3060\u306A\u3044\u3088</div>';

      document.getElementById('tagList').innerHTML = all.tags.map(t => `
        <div class="list-item">
          <span><span class="badge tag">${esc(t.name)}</span> <span class="muted">${tagUsage(t.id)}\u4EF6\u3067\u4F7F\u7528\u4E2D</span></span>
          <button class="btn danger small" onclick="delMaster('tags','${esc(t.id)}','${esc(t.name)}',${tagUsage(t.id)})">\u524A\u9664</button>
        </div>`).join('') || '<div class="muted">\u30BF\u30B0\u306F\u307E\u3060\u306A\u3044\u3088</div>';
    }

    function addMaster(kind) {
      const inputId = kind === 'cats' ? 'newCat' : 'newTag';
      const name = document.getElementById(inputId).value.trim();
      if (!name) { setStatus('\u540D\u524D\u3092\u5165\u308C\u3066\u306D', false); return; }
      callApi({ action: 'addMaster', data: { kind: kind, name: name } }).then(res => {
        (kind === 'cats' ? all.cats : all.tags).push(res);
        document.getElementById(inputId).value = '';
        renderMaster();
        renderFilters();
        setStatus('\u8FFD\u52A0\u3057\u305F\u3088', true);
      }).catch(err => setStatus('\u30A8\u30E9\u30FC: ' + err.message, false));
    }

    function delMaster(kind, id, name, usage) {
      const warn = usage > 0
        ? `\u300C${name}\u300D\u306F${usage}\u4EF6\u306E\u8CC7\u6599\u3067\u4F7F\u308F\u308C\u3066\u308B\u3088\u3002\u305D\u308C\u3067\u3082\u524A\u9664\u3059\u308B\uFF1F`
        : `\u300C${name}\u300D\u3092\u524A\u9664\u3059\u308B\uFF1F`;
      if (!confirm(warn)) return;
      callApi({ action: 'delMaster', data: { kind: kind, id: id } }).then(() => {
        if (kind === 'cats') all.cats = all.cats.filter(c => c.id !== id);
        else all.tags = all.tags.filter(t => t.id !== id);
        renderMaster();
        renderFilters();
        render();
        setStatus('\u524A\u9664\u3057\u305F\u3088', true);
      }).catch(err => setStatus('\u30A8\u30E9\u30FC: ' + err.message, false));
    }

    // ============================================
    // \u8D77\u52D5: \u4FDD\u5B58\u6E08\u307F\u30BB\u30C3\u30B7\u30E7\u30F3\u304C\u3042\u308C\u3070\u691C\u8A3C\u3057\u3066\u304B\u3089\u30A2\u30D7\u30EA\u8868\u793A
    // ============================================
    document.getElementById('loginPw').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    if (session && session.token) {
      callApi({ action: 'me' }).then(res => {
        session.name = res.name;
        session.role = res.role;
        storageSet('session', JSON.stringify(session));
        showApp();
      }).catch(() => {
        clearSession();
        showLogin('');
      });
    } else {
      showLogin('');
    }
  </script>
</body>
</html>
